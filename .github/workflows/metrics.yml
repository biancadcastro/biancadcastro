name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: biancadcastro
          filename: github-metrics.svg

          template: terminal
          base: header, activity, community, repositories

          plugin_languages: yes
          plugin_languages_threshold: 2%
          plugin_languages_limit: 6

          plugin_lines: yes
          plugin_lines_sections: base

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

          plugin_achievements: yes
          plugin_achievements_display: compact

          extras_css: |
            svg { color: #2b140b; }
            .header { background: linear-gradient(#f3c9bd 0%, #eab6a5 100%); }
            .title { color: #6b3a28; }
            .button { background: linear-gradient(#f6ddd4 0%, #e3a79c 100%); }
            .button.exit { background: linear-gradient(#e2653a 0%, #c2573a 100%); }
            pre { background: #fcf2ee; }
            pre, .banner, footer { color: #4a2c1e; }
            .banner, footer { color: #8f7168; }
            .ps1-path { color: #e2653a; }
            .ps1-location { color: #c9847a; }
            :root {
              --color-calendar-graph-day-bg: #f7e6e1;
              --color-calendar-graph-day-border: rgba(107,58,40,0.12);
              --color-calendar-graph-day-L1-bg: #f3c9bd;
              --color-calendar-graph-day-L2-bg: #eab6a5;
              --color-calendar-graph-day-L3-bg: #de8a6f;
              --color-calendar-graph-day-L4-bg: #c2573a;
            }
